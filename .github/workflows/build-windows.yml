name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt libraries for the GUI tests (offscreen)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest
      - run: pytest -q -rs
        env:
          QT_QPA_PLATFORM: offscreen

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(python -c 'import otdr_report;print(otdr_report.__version__)')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        run: pyinstaller --noconfirm OTDRBatchReport.spec
      - name: Smoke test (parse + PDF with the frozen libraries)
        shell: bash
        run: python tools/run_selftest.py
      - name: Inno Setup
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: OTDRBatchReport-Setup-${{ steps.ver.outputs.version }}
          path: dist/OTDRBatchReport-Setup-*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/OTDRBatchReport-Setup-*.exe
