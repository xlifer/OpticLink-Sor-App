name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt libraries for the GUI tests (offscreen)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements.txt pytest pypdf pdfplumber
      - run: pytest -v -rs -o faulthandler_timeout=120
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -v -rs -o faulthandler_timeout=120
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUNBUFFERED: "1"
      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF#refs/tags/v}"; else v="$(python -c 'import otdr_report;print(otdr_report.__version__)')"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: PyInstaller
        run: pyinstaller --noconfirm GrandwayBatchReport.spec
      - name: Smoke test (parse + PDF with the frozen libraries)
        shell: bash
        run: python tools/run_selftest.py
      - name: Inno Setup
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.ver.outputs.version }} installer\setup.iss
      - name: Build the previous release 3.0.0 (for the real upgrade test)
        run: |
          git fetch --depth=1 origin 91e20b5374d66cae83ddd851d231b5ab1bed46db
          git worktree add ..\old 91e20b5374d66cae83ddd851d231b5ab1bed46db
          cd ..\old
          pyinstaller --noconfirm GrandwayBatchReport.spec
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=3.0.0 installer\setup.iss
      - name: Upgrade 3.0.0 -> new version (app open, then closed)
        shell: bash
        run: python tools/check_upgrade.py ../old/dist/GrandwayBatchReport-Setup-3.0.0.exe "$(ls dist/GrandwayBatchReport-Setup-*.exe)" dist/GrandwayBatchReport build/upgrade-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-check
          path: build/upgrade-check/*.log
          if-no-files-found: ignore
      - name: Icons embedded in the exe and Setup.exe (= icon.ico from program_icon.png)
        shell: bash
        run: python tools/check_icons.py exe dist/GrandwayBatchReport/GrandwayBatchReport.exe dist/GrandwayBatchReport-Setup-*.exe
      - name: Installed program - window / taskbar icon
        shell: bash
        run: python tools/check_icons.py installed "$(ls dist/GrandwayBatchReport-Setup-*.exe)" build/icon-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: icon-check
          path: build/icon-check/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: GrandwayBatchReport-Setup-${{ steps.ver.outputs.version }}
          path: dist/GrandwayBatchReport-Setup-*.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GrandwayBatchReport-Setup-*.exe
